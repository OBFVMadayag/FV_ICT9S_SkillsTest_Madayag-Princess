<!DOCTYPE html>
<html lang="en">
<head>
    <link rel = "stylesheet" href="styles_Q1SkillsTest.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
</head>
<body>
<div class="header">

    <label for="obmc logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQB79TS4FgV1ODOuatHhIKXim_Ppl9KsR8Ei9bF1hJByA&s" alt="OBMC Logo">
    </label>

    <label for="robotics club image">
<img src="https://cdn.prod.website-files.com/61f7efd44d01cc87c88dc6f3/640311d1c3eece396e50089a_Robotics-for-Kids.jpg" alt="Robotics Club">
    </label>

    <label for="greetings">
        <p>
            Welcome to the OBMC Robotics Club! Kindly fill out this form if you are interested.
        </p>

        </label>
</div>

<div class="form">

<label for="your full name">Your Full Name</label>
<br>
<input type="text" id="yourfullname" name="yourfullname" required>
<br>

</div>

<div class="form2">

<label for="Email">Email</label>
<br>
<input type="text" id="email" name="email" required>
<br>

</div>

<div class="form3">
<label for="Grade Level and Section"></label>
<br>
<input type="radio" id="9 Emerald" name="9 Emerald" value="9 Emerald">
<input type="radio" id="9 Ruby" name="9 Ruby" value="9 Ruby">
<input type="radio" id="9 Sapphire" name="9 Sapphire" value="9 Sapphire">
<input type="radio" id="9 Topaz" name="9 Topaz" value="9 Topaz">
<input type="radio" id="9 Jade" name="9 Jade" value="9 Jade">
<br>

<label for="Gender"></label>
<br>
<input type="radio" id="Female" name="Gender" value="Female">
<input type="radio" id="Male" name="Gender" value="Male">
<br>

<label for="What are your skills?">What are your skills?/label>
    <input type="checkbox" id="Programming" name="Programming" value="Programming">
    <input type="checkbox" id="Mathematics" name="Mathematics" value="Mathematics">
    <input type="checkbox" id="Communication Skills" name="Communication Skills" value="Communication Skills">

   <label for="Type here an explanation on why you are willing to join.">Type here an explanation on why you are willing to join."</label>
<br>
<input type="text" id="Type here an explanation on why you are willing to join." name="Type here an explanation on why you are willing to join." required>
<br>

</div>

<div class="List of Activities">

<ul>

<h1>List of Robotics Club Activities</h1>
<li>Building brushbots</li>
<li>Creative artbots</li>
<li>Programming a drone</li>

</ul>

</div>

<button type="submit" id="submit" name="submit">Submit</button>

<div class="link">
            <a href="https://youtu.be/6K3CXd-8ZFk?si=Gu2U6mVRWZyCI0bG" target="https://youtu.be/6K3CXd-8ZFk?si=Gu2U6mVRWZyCI0bG"></a>
    </div>
